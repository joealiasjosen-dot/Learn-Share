<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Learn&Share</title>
<style>
:root{--bg:#f7f6f2;--cd:#fff;--tx:#1f1f1d;--mu:#6b6a65;--bd:#e2e0d8;--ac:#4f46e5;--a2:#eef0ff;--ok:#0f766e;--er:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--cd:#212126;--tx:#f0efe9;--mu:#a3a29b;--bd:#35353b;--ac:#8b8cf8;--a2:#2a2b4a;--ok:#5eead4;--er:#fda29b}}
:root[data-theme="dark"]{--bg:#17171a;--cd:#212126;--tx:#f0efe9;--mu:#a3a29b;--bd:#35353b;--ac:#8b8cf8;--a2:#2a2b4a;--ok:#5eead4;--er:#fda29b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px}
main{max-width:760px;margin:auto;padding:16px}h1{font-size:22px;margin:4px 0 12px}h2{font-size:18px;margin:20px 0 8px}h3{font-size:16px;margin:0 0 8px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
button{font:inherit;background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.s{padding:5px 10px;font-size:14px}
button.chip{background:var(--cd);color:var(--tx);border:1px solid var(--bd)}button.chip.on{background:var(--a2);color:var(--ac);border-color:var(--ac)}
input,select,textarea{font:inherit;width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:9px;margin-top:4px}
input[type=checkbox]{width:auto;margin:0 8px 0 0}label{display:block;font-size:14px;color:var(--mu);margin:8px 0}
.mu{color:var(--mu);font-size:14px}.er{color:var(--er);font-size:14px;min-height:1em}.id{font-family:ui-monospace,monospace;background:var(--a2);color:var(--ac);padding:2px 8px;border-radius:6px;font-size:14px;word-break:break-all}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--cd);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{background:none;color:var(--mu);padding:6px 10px;font-size:14px}nav button.on{color:var(--ac);font-weight:600}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}.dlg{background:var(--cd);border-radius:14px;padding:18px;width:100%;max-width:420px;max-height:85vh;overflow:auto}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:20px;font-size:14px;z-index:10;display:none;max-width:90%}
.msg{background:var(--a2);border-radius:12px;padding:8px 12px;margin:6px 0;max-width:85%;word-break:break-word}.msg.me{margin-left:auto;background:var(--ac);color:#fff}.msg small{display:block;opacity:.7}
details{margin-left:14px;border-left:2px solid var(--bd);padding-left:8px}summary{cursor:pointer;font-weight:600;margin:4px 0}.lf{margin:3px 0 3px 14px}
.opt{display:block;width:100%;text-align:left;margin:4px 0;background:var(--bg);color:var(--tx);border:1px solid var(--bd)}.opt.ok{border-color:var(--ok);color:var(--ok)}.opt.bad{border-color:var(--er);color:var(--er)}
.slide{background:var(--a2);border-radius:12px;padding:20px;min-height:200px}.img{border:1px dashed var(--ac);border-radius:8px;padding:10px;margin-top:10px;color:var(--ac);font-size:14px}
button:disabled{opacity:.4;cursor:default}.opt:disabled{opacity:1}.guide{border-color:var(--ac);background:var(--a2)}.hl{outline:3px solid var(--ac);outline-offset:3px;animation:pl 1.2s infinite}@keyframes pl{50%{outline-color:transparent}}
pre{white-space:pre-wrap;word-break:break-word;font:inherit}.av{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--a2)}
</style></head><body><div id="app"></div><div id="modal"></div><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={in:0,acct:null,spaces:[],groups:[],dl:[],set:{lang:'English',theme:'system'}};
try{S=Object.assign(S,JSON.parse(localStorage.getItem('ls')||'{}'))}catch{}
let sy;const save=()=>{try{localStorage.setItem('ls',JSON.stringify(BE?{...S,spaces:[],groups:[],in:0,acct:null}:S))}catch{toast('Storage full: delete some downloads')}clearTimeout(sy);sy=setTimeout(push,2000)};
const use=n=>window.claude?window.claude.use(n):Promise.resolve(null);
const hs=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const SY='!@$*+=~',rnd=n=>{const st=['abcdefghjkmnpqrstuvwxyz','ABCDEFGHJKLMNPQRSTUVWXYZ','23456789',SY],a=new Uint32Array(n);crypto.getRandomValues(a);return [...Array(n)].map((_,i)=>{const s=i<4?st[i]:st[a[i]%4];return s[(a[i]>>>4)%s.length]}).sort(()=>Math.random()-.5).join('')};
const LANGS=['English','Tamil','Hindi','Telugu','Malayalam','Kannada','Spanish','French','German','Arabic','Chinese','Japanese'],LC={English:'en-US',Tamil:'ta-IN',Hindi:'hi-IN',Telugu:'te-IN',Malayalam:'ml-IN',Kannada:'kn-IN',Spanish:'es-ES',French:'fr-FR',German:'de-DE'};
const T={English:{learn:'Learn',share:'Share',downloads:'Downloads',settings:'Settings'},Tamil:{learn:'கற்க',share:'பகிர்',downloads:'பதிவிறக்கங்கள்',settings:'அமைப்புகள்'},Hindi:{learn:'सीखें',share:'साझा करें',downloads:'डाउनलोड',settings:'सेटिंग्स'},Spanish:{learn:'Aprender',share:'Compartir',downloads:'Descargas',settings:'Ajustes'},French:{learn:'Apprendre',share:'Partager',downloads:'Téléchargements',settings:'Réglages'}};
const t=k=>(T[S.set.lang]||T.English)[k];
const FM=['Revision','Exam','Research','Learning'],LV=['Short','Detailed','Highly detailed'],SD=['Short','Default','Long'];
const FEATS={mindmap:{n:'Mind map',o:[['Length',LV],['Format',FM]]},video:{n:'Video',o:[['Type',['Realistic','Animation']],['Duration',['Short','Medium','Long','Custom']],['Format',FM],['Style',['Glance','Explanation']]]},podcast:{n:'Podcast',o:[['Format',['Review','Revision','Research','Debate']],['Voices',[1,2,3,4]],['Duration',SD]]},quiz:{n:'Quiz',o:[['Level',['Easy','Medium','Hard']],['Format',FM],['Questions',[5,10,15,20,30,50],15]]},ppt:{n:'PPT',o:[['Slides',['Few','Default','More']],['Format',FM],['Images',['Add images','Content only']]]},summary:{n:'Summary',o:[['Length',SD],['Format',FM]]}};
const SCH={mindmap:'{"root":string,"children":[{"t":string,"children":[...]}]} up to 4 levels',video:'{"title":string,"scenes":[{"visual":string,"narration":string,"seconds":number,"svg":"flat SVG illustration for the scene, viewBox 0 0 960 540, no scripts, no text"}]}',podcast:'{"title":string,"lines":[{"voice":number from 1 to the voice count,"text":string}]}',quiz:'{"title":string,"questions":[{"q":string,"options":[4 strings],"answer":index 0-3,"why":string}]}',ppt:'{"title":string,"slides":[{"title":string,"bullets":[string]}]}',ppti:'{"title":string,"slides":[{"title":string,"bullets":[string],"svg":"a simple flat SVG illustration for the slide, viewBox 0 0 400 240, no scripts, no text smaller than 14"}]}',summary:'{"title":string,"text":string in markdown}'};
let V={tab:'learn',lt:'in',feat:'summary',out:0,sl:0,sp:null,gr:null,msgs:[],unl:{}},db,uid,unsub,sm;
function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',3500)}
function ask(title,fields,ok='Continue',note='',err=''){return new Promise(r=>{$('#modal').innerHTML=`<div class=ov><div class=dlg><h3>${title}</h3>${note?`<p class=mu>${note}</p>`:''}${fields.map((f,i)=>`<label>${f.l}<input id=mf${i} type="${f.t||'text'}" value="${esc(f.v||'')}"></label>`).join('')}<p class=er>${err}</p><div class=row><button class=g id=mc>Cancel</button><button id=mo>${ok}</button></div></div></div>`;const d=v=>{$('#modal').innerHTML='';r(v)};$('#mc').onclick=()=>d(null);$('#mo').onclick=()=>d(fields.map((_,i)=>$('#mf'+i).value.trim()))})}
async function form(title,fields,ok,note,check){let err='',v;do{v=await ask(title,fields,ok,note,err);if(!v)return null;err=check(v)||''}while(err);return v}
function theme(){const r=document.documentElement;S.set.theme=='system'?r.removeAttribute('data-theme'):r.dataset.theme=S.set.theme}
async function ai(p){sm=sm||await use('sample');if(!sm)throw new Error('AI is not available in this view');return sm.json(p)}
function login(){const up=V.lt=='up';$('#app').innerHTML=`<main><h1>Learn&amp;Share</h1><p class=mu>Learn anything quickly, and share what you know.</p><div class=card><div class=row><button class="chip ${up?'':'on'}" onclick="V.lt='in';render()">Sign in</button><button class="chip ${up?'on':''}" onclick="V.lt='up';render()">Create account</button></div>${up?'<label>Name<input id=ln></label>':''}<label>Email<input id=le type=email></label><label>Password<input id=lp type=password></label><p class=er id=lerr></p><button onclick="auth()">${up?'Create account':'Sign in'}</button> ${up?'':'<button class=g onclick="forgot()">Forgot password?</button>'}<p class=mu>Or continue with</p><div class=row><button class=g onclick="social('Google')">Google</button><button class=g onclick="social('Microsoft')">Microsoft</button><button class=g onclick="social('GitHub')">GitHub</button></div><p class=mu>Demo build: accounts are stored on this device only.</p></div></main>`}
async function onboard(){const v=await form('Finish your profile',[{l:'Date of birth',t:'date'},{l:'Country of residence'},{l:'Contact number',t:'tel'}],'Save','',v=>v.every(Boolean)?'':'All three fields are required');if(!v)return false;Object.assign(S.acct,{dob:v[0],country:v[1],phone:v[2]});return true}
async function auth(){const up=V.lt=='up',e=$('#le').value.trim().toLowerCase(),p=$('#lp').value,n=up?$('#ln').value.trim():'';const er=m=>$('#lerr').textContent=m;if(!e||!p||(up&&!n))return er('Please fill in every field');const B=await be('/auth/'+(up?'signup':'login'),J({email:e,password:p,name:n}));if(B&&B.user){S.acct={...B.user,pw:''};uid=B.user.id;if(up){if(!await onboard())return;await api('/me',{...J({...S.acct,lang:S.set.lang,theme:S.set.theme}),method:'PUT'})}S.in=1;await loadSpaces();await loadGroups();save();return render()}if(BE)return er(up?'Could not create the account. It may already exist.':'Email or password is incorrect');if(!S.acct)await pull();const h=await hs(p);
if(up){if(S.acct?.email==e)return er('Account exists. Sign in instead.');S.acct={email:e,name:n,pw:h};if(!await onboard()){S.acct=null;return}}else if(!S.acct||S.acct.email!=e||S.acct.pw!=h)return er('Email or password is incorrect');S.in=1;save();render()}
async function social(p){if(BE)return toast('Social sign-in is not set up on this server yet.');const v=await form(p+' sign-in (demo)',[{l:'Email'},{l:'Name'}],'Continue','This demo simulates the provider login.',v=>v[0]&&v[1]?'':'Both fields required');if(!v)return;S.acct=S.acct?.email==v[0]?S.acct:{email:v[0].toLowerCase(),name:v[1],pw:''};if(!S.acct.dob&&!await onboard())return;S.in=1;save();render()}
async function forgot(){const v=await form('Reset password',[{l:'Email'},{l:'Date of birth',t:'date'}],'Send OTP','',v=>v[0]&&v[1]?'':'Both fields are required');if(!v)return;const live=await be('/auth/otp',J({email:v[0],dob:v[1]}));if(!live&&!(S.acct&&S.acct.email==v[0].toLowerCase()&&S.acct.dob==v[1]))return toast('Details do not match our records');const otp=live?null:String(Math.floor(1e5+Math.random()*9e5));if(otp)toast('Demo OTP: '+otp+' (the backend emails a real one)');const w=await form('Enter OTP',[{l:'6-digit OTP'},{l:'New password',t:'password'}],'Reset',live?'We emailed a 6-digit code.':'',w=>w[1].length<8?'Password needs 8+ characters':otp&&w[0]!=otp?'Wrong OTP':'');if(!w)return;if(live){if(!await be('/auth/reset',J({email:v[0],otp:w[0],password:w[1]})))return toast('OTP is wrong or expired')}else S.acct.pw=await hs(w[1]);save();toast('Password updated. Sign in now.')}
function render(){if(!S.in)return login();const tabs=['learn','share','downloads','settings'];$('#app').innerHTML=`<main id=mn></main><nav>${tabs.map(k=>`<button class="${V.tab==k?'on':''}" onclick="go('${k}')">${t(k)}</button>`).join('')}</nav>`;$('#mn').innerHTML=(navigator.onLine?'':`<div class="card er">${OFF}</div>`)+guide()+({learn:learnV,share:shareV,downloads:dlV,settings:setV})[V.tab]();if(V.tab=='share'&&V.gr!=null)drawMsgs();if($('#vc'))vmount();if($('#pb'))pmount();const hl=G.sel&&$(G.sel);if(hl){hl.classList.add('hl');if(G.k!=G.sel){G.k=G.sel;hl.scrollIntoView({block:'center',behavior:'smooth'})}}}
function go(k){V.tab=k;V.sp=null;V.gr=null;unsub&&unsub();unsub=null;render()}
function learnV(){if(V.sp!=null)return spaceV();return `<h1>Your learning spaces</h1>${BE&&!S.acct.hasKey?'<div class=card><b>Add your AI key</b><p class=mu>AI features use your own Anthropic API key, billed to your account.</p><button onclick="go(\'settings\')">Open Settings</button></div>':''}<button onclick="newSpace()">New learning space</button>${S.spaces.length?'':'<p class=mu>No spaces yet. Create one, add sources, then turn them into a mind map, quiz, podcast and more.</p>'}${S.spaces.map((s,i)=>`<div class=card><div class="row sp"><div><b>${esc(s.name)}</b><br><span class=id>${esc(s.id)}</span><br><span class=mu>${s.ns??s.sources.length} sources, ${s.no??s.outputs.length} items</span></div><button onclick="openSpace(${i})">Open</button></div></div>`).join('')}`}
async function newSpaceL(){const v=await form('New learning space',[{l:'Name'},{l:'Password',t:'password'}],'Create','An ID with letters, numbers and symbols is generated for you.',v=>v[0]&&v[1].length>=4?'':'Name and a password (4+ characters) are required');if(!v)return;S.spaces.push({id:rnd(10),name:v[0],pw:await hs(v[1]),sources:[],outputs:[]});save();V.unl[S.spaces.length-1]=1;V.sp=S.spaces.length-1;render()}
async function openSpaceL(i){if(!V.unl[i]){const v=await ask('Enter password',[{l:S.spaces[i].name,t:'password'}],'Open');if(!v)return;if(await hs(v[0])!=S.spaces[i].pw)return toast('Wrong password');V.unl[i]=1}V.sp=i;V.out=0;render()}
function spaceV(){const sp=S.spaces[V.sp],F=FEATS[V.feat];return `<button class=g onclick="V.sp=null;render()">Back</button><h1>${esc(sp.name)}</h1><span class=id>${esc(sp.id)}</span> <span class=mu>Changes save automatically</span>
<h2>Sources</h2><div class=card><div class=row><button onclick="$('#fi').click()">Upload file</button><button class=g onclick="addText()">Paste text or web page</button></div><input id=fi type=file multiple hidden onchange="addFiles(this.files)"><p class=mu>The AI reads each source, removes anything that is not useful for learning, and saves the rest.</p>
${sp.sources.map((s,i)=>`<div class=row style="margin:6px 0"><label style="margin:0;flex:1;color:var(--tx)"><input type=checkbox class=src value=${i} ${s.keep?'checked':'disabled'}>${esc(s.name)}<br><span class=mu>${s.keep?'Ready: '+esc(s.note||''):'Filtered out: '+esc(s.note||'')}</span></label>${s.keep?'':`<button class="g s" onclick="keepSrc(${i})">Keep anyway</button>`}<button class="g s" onclick="delSrc(${i})">Delete</button></div>`).join('')||'<p class=mu>No sources yet.</p>'}</div>
<h2>Create learning material</h2><div class=card><div class=row>${Object.keys(FEATS).map(k=>`<button class="chip ${V.feat==k?'on':''}" onclick="V.feat='${k}';V.out=S.spaces[V.sp].outputs.findIndex(o=>o.feat=='${k}');render()">${FEATS[k].n}</button>`).join('')}</div>
${F.o.map(([l,v,d],i)=>`<label>${l}<select id=fo${i}>${v.map(x=>`<option${x==(d??(v.includes('Default')?'Default':v[0]))?' selected':''}>${x}</option>`).join('')}</select></label>`).join('')}${V.feat=='video'?'<label>Custom duration (hh:mm:ss, used when Duration is Custom)<input id=cust placeholder="00:05:00"></label>':''}
<label>Language<select id=lang>${LANGS.map(l=>`<option${l==S.set.lang?' selected':''}>${l}</option>`).join('')}</select></label><label>Areas to focus (optional)<textarea id=focus rows=2></textarea></label><button id=gb onclick="gen()">Create ${F.n.toLowerCase()} from selected sources</button></div>
<div id=out>${sp.outputs[V.out]&&sp.outputs[V.out].feat==V.feat?outHs(sp.outputs[V.out]):`<div class=card style="min-height:${V.feat=='mindmap'?420:160}px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mu)">Your ${FEATS[V.feat].n.toLowerCase()} will appear here.</div>`}</div>
<h2>Library</h2>${sp.outputs.map((o,i)=>`<div class="card row sp"><div><b>${esc(o.title)}</b><br><span class=mu>${FEATS[o.feat].n}, ${new Date(o.ts).toLocaleDateString()}</span></div><div class=row><button class="s" onclick="V.out=${i};V.feat='${o.feat}';V.sl=0;render();$('#out').scrollIntoView();openOut(S.spaces[V.sp].outputs[${i}])">Open</button><button class="g s" onclick="dl(${i})">Download</button><button class="g s" onclick="delOut(${i})">Delete</button></div></div>`).join('')||'<p class=mu>Nothing created yet.</p>'}`}
async function addSourceL(name,text){if(!navigator.onLine)return toast(OFF);const sp=S.spaces[V.sp];toast('Analysing '+name+'...');let r={keep:true,note:'Added without AI filtering',cleaned:text};try{r=await ai(`You curate study material. Judge whether this source is useful for learning. Return only JSON {"keep":boolean,"note":"one short sentence","cleaned":"the learning-relevant content, cleaned and structured, max 1500 words"}.\n\nSOURCE ${name}:\n${text.slice(0,14000)}`)}catch(e){}sp.sources.push({name,text:text.slice(0,14000),clean:r.cleaned||text,keep:!!r.keep,note:r.note});save();render()}
function addFilesL(fs){[...fs].forEach(async f=>{try{toast('Reading '+f.name+'...');addSource(f.name,await extract(f))}catch(e){toast(f.name+': '+(e.message||'could not be read'))}})}
async function addText(){const v=await form('Add a source',[{l:'Title or web address'},{l:'Paste the text (leave empty to fetch a web address)'}],'Add','',v=>v[0]&&(v[1].length>20||/^https?:\/\//.test(v[0]))?'':'Enter a web address, or a title with the pasted text');if(!v)return;if(!v[1]){const r=await be('/fetch-url?url='+encodeURIComponent(v[0]));return r&&r.text?addSource(v[0],r.text):toast('Fetching web pages needs the backend. Paste the text instead.')}addSource(v[0],v[1])}
const keepSrc=async i=>{const sp=S.spaces[V.sp];if(BE){await api('/spaces/'+enc(sp.id)+'/sources/'+sp.sources[i].id+'/keep',{method:'POST'},sp);await loadSrc(sp);return render()}const s=sp.sources[i];s.keep=1;s.clean=s.text;save();render()},delSrc=async i=>{const sp=S.spaces[V.sp];if(BE){await api('/spaces/'+enc(sp.id)+'/sources/'+sp.sources[i].id,{method:'DELETE'},sp);await loadSrc(sp);return render()}sp.sources.splice(i,1);save();render()};
async function gen(){if(!navigator.onLine)return toast(OFF);const sp=S.spaces[V.sp],ids=[...document.querySelectorAll('.src:checked')].map(e=>+e.value);if(!ids.length)return toast('Select at least one source');const f=V.feat,F=FEATS[f],vals=F.o.map(([l],i)=>[l,$('#fo'+i).value]),g=k=>(vals.find(x=>x[0]==k)||[])[1];
if(f=='podcast'&&g('Format')=='Debate'&&+g('Voices')<2)return toast('Debate needs 2 or more voices');let st=vals.map(x=>x.join(': ')).join('; ');if(f=='video'&&g('Duration')=='Custom')st+='; Custom duration '+($('#cust').value||'00:05:00');
const lang=$('#lang').value,p=`You are an expert learning-material designer. Using ONLY the sources below, create a ${F.n}. Settings: ${st}. Language: ${lang}. Areas to focus: ${$('#focus').value||'none given'}. Where a setting is "Default", choose what suits the sources and the other settings. Think critically about the focus request. ${f=='video'?' Scene durations must add up to the requested duration (Short about 1 minute, Medium about 3, Long about 6, Custom as given), with at most 20 scenes. Illustration style: '+(g('Type')=='Animation'?'cartoon animation':'realistic, natural colours')+'.':''} Return only JSON shaped like ${f=='ppt'&&g('Images')=='Add images'?SCH.ppti:SCH[f]}.\n\n`+ids.map(i=>`SOURCE ${sp.sources[i].name}:\n${(sp.sources[i].clean||'').slice(0,6000)}`).join('\n\n');
const b=$('#gb');b.disabled=1;b.textContent='Creating... this can take a minute';try{if(BE)await genBE(sp,f,vals,lang,ids);else{const d=await ai(p);sp.outputs.unshift({feat:f,title:d.title||d.root||F.n,data:d,lang,ts:Date.now(),img:g('Images')=='Add images',anim:g('Type')=='Animation'})}V.out=0;V.sl=0;save();render();$('#out').scrollIntoView();openOut(sp.outputs[0])}catch(e){toast('Could not create: '+(e.message||'try again'));b.disabled=0;b.textContent='Try again'}}
